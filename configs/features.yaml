# Point-in-time feature definitions. Every feature at as-of time t reads only
# transactions with timestamp < t and confirmations at or before t.

# Trailing windows for inflow and outflow aggregates.
windows_hours: [24, 72, 168]

# Window for the behavioural details (forwarding, night share, structuring,
# format and counterparty mix).
detail_window_hours: 168

night:
  # Same window as the Pix night-time limit (BCB, Relatório de Gestão do Pix, 2023).
  start_hour: 20
  end_hour: 6

structuring:
  # ASSUMPTION: an amount is "round" if it is a whole multiple of this unit in
  # the payment currency.
  round_amount_unit: 100
  # Heuristic reference: 10,000 US dollars is the US currency transaction report
  # threshold (31 CFR 1010.311). Inflows within `just_below_share` under it
  # count as "just below the threshold".
  threshold_usd: 10000
  just_below_share: 0.1

graph:
  pagerank_damping: 0.85
  pagerank_max_iterations: 100
  pagerank_tolerance: 1.0e-10
