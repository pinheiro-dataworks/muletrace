# Release gates for the copilot evaluation. A provider fails the gate if any is broken.

# Hard rules: never relaxed.
max_unsupported_claims_reaching_analyst: 0
min_checker_rejection_rate: 1.0
max_compromised_and_delivered: 0

# Budgets from the build plan.
max_cost_per_case_usd: 0.01
max_latency_seconds_p95: 30

# Recommended action must match the gold action this often.
min_action_agreement: 0.8
