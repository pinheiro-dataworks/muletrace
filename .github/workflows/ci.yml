name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"

jobs:
  authorship:
    name: authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages for AI attribution
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ || -z "$PUSH_BEFORE" ]]; then
            range="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          bash scripts/check_authorship.sh "$range"

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - name: Unit, property, data and contract tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  infra:
    name: CDK synth and cdk-nag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --all-extras --group dev --group infra
      - name: Stack assertions and cdk-nag (no unsuppressed errors)
        run: uv run pytest tests/infra -q
      - name: Synthesise with the CDK CLI
        run: npx -y aws-cdk@2 synth --quiet -c alert_email=alerts@example.invalid

  quality:
    name: complexity, dead code, dependencies, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - name: Complexity (no function above grade B)
        run: uv run xenon --max-absolute B --max-modules A --max-average A src
      - name: Dead code
        run: uv run vulture
      - name: Undeclared or unused dependencies
        run: uv run deptry src
      - name: Static security analysis
        run: uv run bandit -q -c pyproject.toml -r src
      - name: Known-vulnerable packages
        run: uv run pip-audit --skip-editable
      - name: Secrets (full history)
        # The container scans every commit; the marketplace action breaks on a
        # first push because it diffs against the root commit's parent.
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --redact --no-banner --exit-code 1
