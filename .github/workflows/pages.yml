name: pages

# Publishes the static case explorer in demo/ to GitHub Pages. The cases are precomputed by
# `muletrace demo build` and committed, so this job only uploads files; nothing is computed here.
# One-time owner setting: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["demo/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so checkout needs contents: read again.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
